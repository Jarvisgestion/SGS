# Despliegue en un servidor propio. Para un servicio administrado (Fly, Render,
# Railway) alcanza con el Dockerfile y una base gestionada — ver DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgs
      POSTGRES_USER: sgs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgs -d sgs']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://sgs:${POSTGRES_PASSWORD}@db:5432/sgs
      SGS_SESSION_SECRET: ${SGS_SESSION_SECRET:?falta SGS_SESSION_SECRET}
      # El contenedor está detrás de un proxy con HTTPS: sin esto, el freno al
      # sondeo de contraseñas vería siempre el IP del proxy.
      SGS_TRUST_PROXY: 'true'
      PORT: '3000'
    volumes:
      - adjuntos:/app/var/attachments
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  datos:
  adjuntos:
